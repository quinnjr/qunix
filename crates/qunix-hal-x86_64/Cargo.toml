[package]
name = "qunix-hal-x86_64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
qunix-abi.workspace = true
# The per-CPU block carries this CPU's run queue, so the arch layer needs the
# policy type. The dependency runs one way only: `qunix-sched` is pure logic
# and knows nothing about CPUs.
qunix-sched.workspace = true
qunix-sync.workspace = true
x86_64.workspace = true

[features]
default = []
std = []
# Asserts that interrupts are never re-enabled while this processor holds an
# `IrqSpinLock`. Paired with `qunix-sync/deadlock-panic`, which bounds the wait
# that such a mistake produces.
deadlock-panic = []

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "flags"
harness = false
