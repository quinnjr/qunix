[package]
name = "qpkg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Arch-sourced package pipeline for the qunix distribution"

[features]
# Tests that reach the real network (mirror sync, live builds). Excluded from
# `cargo xtask test`; run explicitly with `cargo test -p qpkg --features online`.
online = []

[dependencies]
clap = { version = "4", features = ["derive"] }
redb = "2"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tar = "0.4"
zstd = "0.13"
flate2 = "1"
sha2 = "0.10"
blake2 = "0.10"
hex = "0.4"
