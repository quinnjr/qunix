# Per-crate line coverage floor. A change may raise these or hold them,
# never drop them by more than the tolerance in xtask/src/coverage.rs.
#
# Regenerate with `cargo xtask coverage --update` when coverage
# genuinely improves, or when a crate gains code that cannot be covered
# at all -- xtask command dispatch that only spawns cargo is the usual
# case. The second kind of update belongs in a PR that says which code
# is uncoverable and why.

# Per-crate line coverage floor. A change may raise these or hold them,
# never drop them by more than the tolerance in xtask/src/coverage.rs.
#
# Regenerate with `cargo xtask coverage --update` when coverage
# genuinely improves, or when a crate gains code that cannot be covered
# at all -- xtask command dispatch that only spawns cargo is the usual
# case. The second kind of update belongs in a PR that says which code
# is uncoverable and why.
# Low because most of this crate cannot execute on the host: `port.rs` is raw
# in/out instructions, and GDT/IDT/APIC touch hardware. What is measured here is
# the pure-logic remainder.
#
# Dropped 25.45 -> 21.69 in M1 Task 1. `percpu.rs` is ~280 lines of `wrmsr`,
# `lgdt`, `ltr` and `gs:`-relative addressing -- none of it can execute in a
# host process, and the parts that could be extracted as pure logic (the offset
# constants) are already compile-time assertions rather than runnable lines. It
# is covered by three new in-QEMU tests, which this number cannot see: the
# kernel's 17 tests run under QEMU where host instrumentation does not reach.
# The denominator grew; the tested fraction did not shrink.
qunix-hal-x86_64 = 21.69

qunix-mm = 96.30

qunix-sched = 100.00

# Three lines are uncovered, all of them deliberately unreachable on a passing
# run: 221-222 are the compile-time auto-trait assertions inside
# `const _: () = {}`, and 304 is the panic arm of the contention test's
# elapsed-time assertion, which only executes when `lock()` failed to block.
# A test whose failure branch is covered is a failing test, so this is the floor
# a green run produces -- on every machine, which is the point.
qunix-sync = 97.33

# xtask's floor is low because each command arm only builds an argument list and
# spawns cargo, and the spawn is not coverable. The argument construction is
# extracted (`bench_args`, `fuzz_args`, `fuzz_selection`) and tested, which is
# what this number actually tracks.
#
# It was lowered to 31.43 once on the claim that `bench_args` was tested. That
# claim was false -- main.rs had no `#[cfg(test)]` module, so those tests never
# compiled. They exist now, which is most of the rise since.
xtask = 49.90
