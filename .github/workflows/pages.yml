name: Pages

on:
  push:
    branches: [develop]
    # Only rebuild when the site or this workflow changes. The kernel's own CI
    # is expensive and unrelated; coupling them would mean every allocator
    # commit redeploys a static site that did not change.
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time, and never cancel one midway: a cancelled deploy can
# leave the Pages environment pointing at a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` rather than `install`: the committed lockfile is only a control
      # if the build is required to honour it.
      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
