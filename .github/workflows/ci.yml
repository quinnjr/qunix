name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # The PR gate is a smoke test; this is where bugs are actually found.
    - cron: '0 4 * * *'

# No job here writes to the repository; the fuzz job in particular builds and
# executes attacker-shaped input, so it should not hold a writable token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      # attest compares against origin/develop, so it needs more than the
      # single commit a shallow checkout provides.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # rust-toolchain.toml pins the nightly and its components; this just
      # honours it rather than choosing a version here.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The kernel boots UEFI-only. GitHub runners have no /dev/kvm, so QEMU
      # falls back to TCG -- slower, and the reason the APIC timer test is
      # bounded generously rather than tightly.
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld
          # Must be a unified image. The split OVMF_CODE*.fd needs a companion
          # writable VARS pflash that the harness does not attach, so pointing
          # at one fails inside the firmware rather than here.
          for candidate in /usr/share/ovmf/OVMF.fd /usr/share/OVMF/OVMF.fd; do
            if [ -f "$candidate" ]; then
              echo "QUNIX_OVMF=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "::error::no unified OVMF image found" >&2
          ls -l /usr/share/ovmf /usr/share/OVMF 2>/dev/null >&2
          exit 1

      - name: Test
        run: cargo xtask test

      # TEMPORARY -- revert once the shootdown deadlock is closed. A kernel
      # backtrace is a list of addresses, and resolving them against a locally
      # rebuilt binary is guesswork: the same source and toolchain still lay
      # symbols out differently enough that frames resolve to the wrong
      # functions. The ELF that actually printed them is the only thing that
      # symbolises them.
      - name: Upload the kernel images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-elf-debug
          path: |
            target/x86_64-qunix-kernel/debug/build/qunix-kernel/*/out/qunix_kernel-*
            target/sched-invariants/x86_64-qunix-kernel/debug/build/qunix-kernel/*/out/qunix_kernel-*
          if-no-files-found: warn

  # The release profile is what ships, and it differs in ways that matter:
  # overflow checks are off, so arithmetic the debug build would have panicked on
  # wraps silently. Nothing else in CI compiled it, which meant a `--release`-only
  # miscompile or lint failure reached a tag unnoticed.
  #
  # Its own job rather than a second step in `test`, and this is the tradeoff:
  # the work is genuinely duplicated -- a full `-Zbuild-std` compile of
  # core/alloc/compiler_builtins, the kernel under thin LTO, every host crate,
  # every in-QEMU test re-run under TCG, plus the licensing and attestation
  # checks, which are profile-independent and so are pure repetition. As a step
  # that roughly doubled the `test` job serially. As a job it is the same machine
  # time but off the critical path, which is what a contributor waits on.
  # `prefix-key` keeps it from sharing (and evicting) the debug job's cache,
  # since the two fill it with different artifacts for the same crates.
  test-release:
    name: test suite (release profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-release

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf clang lld
          # Must be a unified image; see the comment in the `test` job.
          for candidate in /usr/share/ovmf/OVMF.fd /usr/share/OVMF/OVMF.fd; do
            if [ -f "$candidate" ]; then
              echo "QUNIX_OVMF=$candidate" >> "$GITHUB_ENV"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "::error::no unified OVMF image found" >&2
          ls -l /usr/share/ovmf /usr/share/OVMF 2>/dev/null >&2
          exit 1

      - name: Test (release profile)
        run: cargo xtask test --release

  coverage:
    name: coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov

      # criterion pulls in `alloca`, which compiles C. .cargo/config.toml points
      # cc-rs and the linker at clang/LLD, so this is the whole C toolchain
      # requirement -- no musl-gcc, no binutils.
      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # Fails when any crate's line coverage falls below the floor recorded in
      # coverage-baseline.toml. Needs no QEMU: only host-testable crates are
      # measured, which is also the limit of what this number means.
      - name: Coverage must not regress
        run: cargo xtask coverage

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    # -max_total_time bounds libFuzzer but not the sanitizer build; without this
    # a hang there burns the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
      # The `@cargo-fuzz` shorthand tag does not exist -- only some tools have
      # one -- and the action then installs nothing while still succeeding, so
      # the failure surfaces later as `no such command: fuzz`.
      # Pinned tool version, not "latest at run time": this action downloads a
      # prebuilt binary and runs it, which is the same class of trust the
      # bootloader SHA-256 pin exists for.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.1

      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # Deliberately short, and honest about what that buys: it proves the
      # harnesses still build and that 60s from a cold corpus finds nothing. The
      # actual search is the `fuzz-nightly` job below, which runs an hour per
      # target on a schedule and caches its corpus between runs.
      # `cargo fuzz run` has its own CLI and rejects `--locked`, so the
      # committed lock is enforced here instead: this fails if resolving would
      # change it, which is what stops a new build-script-bearing crate from
      # appearing silently in a binary that executes fuzzed input.
      - name: Lockfile is up to date
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Fuzz both targets briefly
        run: cargo xtask fuzz --seconds=60

      # The failing input *is* the finding. Without it a red run leaves a stack
      # trace and a cold corpus, and re-running is unlikely to re-find it --
      # which is how a harness defect gets mistaken for a real bug, three times
      # so far.
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  fuzz-nightly:
    name: fuzz (scheduled, deep)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [buddy, slab]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.1

      - name: Install clang and LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      # Carried between runs so the search compounds instead of restarting cold
      # every night, which is the whole difference from the PR gate.
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        run: cargo xtask fuzz ${{ matrix.target }} --seconds=3600

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
