timeout: 0

/qunix
    protocol: limine
    path: boot():/boot/qunix-kernel
    # Userspace init, loaded as a module rather than linked into the kernel.
    # The kernel finds it by the cmdline string below, not by position, so
    # adding another module cannot silently change which one is run.
    module_path: boot():/boot/init.elf
    module_cmdline: init
