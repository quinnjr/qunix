[package]
name = "qunix-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qunix-kernel"
path = "src/main.rs"
# NOTE: do NOT set `harness = false`. `reexport_test_harness_main` renames
# cargo's generated harness entry point, so that entry point must exist.
test = true

[dependencies]
