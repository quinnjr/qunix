[package]
name = "qunix-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "qunix-kernel"
path = "src/main.rs"
# NOTE: do NOT set `harness = false`. `reexport_test_harness_main` renames
# cargo's generated harness entry point, so that entry point must exist.
test = true

[features]
# Enforces scheduler invariants that cost a lock on the context-switch path:
# `publish_handoff` refuses to queue a parked thread. Correctness-critical to
# check and too expensive to leave on, because it adds a serialisation point per
# switch that the shipped kernel does not have -- so the concurrency tests would
# be measuring a different scheduler. `cargo xtask test` runs the suite both
# with and without it.
sched-invariants = []

# Bounds every spinlock wait so a lock that will never be released panics with
# a backtrace instead of stopping the machine in silence. `cargo xtask test`
# turns this on for both boots; the shipped kernel keeps the unbounded wait.
deadlock-panic = ["qunix-sync/deadlock-panic"]

[dependencies]
limine.workspace = true
qunix-abi.workspace = true
qunix-elf.workspace = true
qunix-sched.workspace = true
qunix-virtio.workspace = true
qunix-hal-x86_64.workspace = true
qunix-sync.workspace = true
x86_64.workspace = true
qunix-mm.workspace = true
